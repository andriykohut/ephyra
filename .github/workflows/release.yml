name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # the same gate main gets. A tag that can't pass it doesn't ship.
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # only a real release moves :latest — the README tells people to
            # pull it, so a v0.1.1-rc1 must not land on their next restart
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      # no QEMU: the binary is pure Go and the Dockerfile cross-compiles from
      # BUILDPLATFORM, so arm64 costs about as much as amd64
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [ci, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # the binary embeds web/dist, so the frontend has to exist before go build
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Cross-compile binaries
        run: |
          set -euo pipefail
          v="$GITHUB_REF_NAME"
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${t%/*}"; arch="${t#*/}"
            d="ephyra_${v}_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/andriykohut/ephyra/internal/buildinfo.version=${v}" \
              -o "dist/${d}/ephyra" ./cmd/ephyra
            cp LICENSE NOTICES.md README.md "dist/${d}/"
            tar -C dist -czf "dist/${d}.tar.gz" "${d}"
            rm -rf "dist/${d}"
          done
          ( cd dist && sha256sum ephyra_*.tar.gz | tee SHA256SUMS )
      - name: Publish release
        run: >
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          dist/ephyra_*.tar.gz dist/SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
